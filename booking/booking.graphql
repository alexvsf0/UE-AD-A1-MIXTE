type Query {
   booking_with_id(_id: String!): Booking
   bookings: [Booking!]
}

type Mutation {
   delete_with_id(_id: String!): MutationResult!
   add_booking(userid: String!, date: String!, movieid: String!): MutationResult!
   delete_date_with_id(_id: String!, date: String!): MutationResult!
   delete_movie_with_id_and_date(_id: String!, date: String!, movie: String!): MutationResult!
   delete_movie_everywhere(movie: String!): MutationResult!
}



type Booking {
   userid: String!
   dates: [Date!]
}

type Date {
   date : String!
   movies : [Movie!]
}

type Movie {
    id: String!
    title: String!
    director: String!
    rating: Float!
    actors: [Actor]
}

type Actor {
    id: String!
    firstname: String!
    lastname: String!
    birthyear: Int!
    films: [String!]
}

type MutationResult {
   success: Boolean!
   message: String!
}