type Query {
    movie_with_id(_id: String!): Movie
    movies: [Movie!]
    movie_with_title(_title: String!): Movie
    actor_with_id(_id: String!): Actor
    actors: [Actor!]
}

type Mutation {
    update_movie_rate(_id: String!, _rate: Float!): Movie
    delete_movie(_id: String!) : MutationResult
    add_movie(_id : String!, title: String!, director: String!, rating: Float!) : MutationResult
    add_actors(id : String!, firstname: String!, lastname: String!, birthyear: Int!, films: [String!]) : MutationResult
    delete_actor(_id: String!) : MutationResult
}

type Movie {
    id: String!
    title: String!
    director: String!
    rating: Float!
    actors: [Actor]
}

type Actor {
    id: String!
    firstname: String!
    lastname: String!
    birthyear: Int!
    films: [String!]
}


type MutationResult {
   success: Boolean!
   message: String!
}