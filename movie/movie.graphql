type Query {
    movie_with_id(_id: String!): Movie
}

type Mutation {
    update_movie_rate(_id: String!, _rate: Float!): Movie
    delete_movie(_id: String!) : DeleteResult
    add_movie(_id : String!, title: String!, director: String!, rating: Float!) : DeleteResult
    add_actors(id : String!, firstname: String!, lastname: String!, birthyear: Int!, films: [String!]) : DeleteResult
    delete_actor(_id: String!) : DeleteResult
}

type Movie {
    id: String!
    title: String!
    director: String!
    rating: Float!
    actors: [Actor]
}

type Actor {
    id: String!
    firstname: String!
    lastname: String!
    birthyear: Int!
    films: [String!]
}


type DeleteResult {
   success: Boolean!
   message: String!
}