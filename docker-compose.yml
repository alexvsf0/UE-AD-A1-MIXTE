services:
  movie:
    build: ./movie/
    ports:
      - "3001:3001"
    environment:
      SCHEDULE_URL: http://schedule:3202
      BOOKING_GRAPHQL_URL: http://booking:3201/graphql
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-dev-key-change-me-in-production}
    volumes:
      - movie-data:/app/data

  booking:
    build: ./booking/
    ports:
      - "3201:3201"
    environment:
      SCHEDULE_URL: http://schedule:3202
      MOVIE_GRAPHQL_URL: http://movie:3001/graphql
      USER_URL: http://user:3203
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-dev-key-change-me-in-production}
    volumes:
      - booking-data:/app/data
    depends_on:
      - movie
      - schedule

  schedule:
    build: ./schedule/
    ports:
      - "3202:3202"
    environment:
      MONGO_URL: mongodb://root:example@mongo:27017/
      MOVIE_GRAPHQL_URL: http://movie:3001/graphql
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-dev-key-change-me-in-production}
    depends_on:
      mongo:
        condition: service_healthy

  user:
    build: ./user/
    ports:
      - "3203:3203"
    environment:
      BOOKING_GRAPHQL_URL: http://booking:3201/graphql
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-dev-key-change-me-in-production}
    volumes:
      - user-data:/app/data

  # Joue un scénario sur toutes les routes au démarrage puis s'arrête.
  # Relancer : docker compose run --rm demo   (ajouter -v pour les réponses)
  demo:
    image: python:3.13-slim
    volumes:
      - ./demo:/demo:ro
    command: ["python", "-u", "/demo/demo.py"]
    environment:
      USER_URL: http://user:3203
      SCHEDULE_URL: http://schedule:3202
      MOVIE_GRAPHQL_URL: http://movie:3001/graphql
      BOOKING_GRAPHQL_URL: http://booking:3201/graphql
      FORCE_COLOR: "1"
    depends_on:
      - movie
      - booking
      - schedule
      - user
    restart: "no"

  mongo:
    image: mongo:8
    command: ["mongod", "--quiet"]
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  movie-data:
  booking-data:
  user-data:
  mongo-data:
